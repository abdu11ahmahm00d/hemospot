name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build`, so this step is the typecheck too.
      # No .env exists in CI and none is needed: Vite inlines VITE_* as
      # undefined and the build is expected to pass without them.
      - name: Typecheck and build
        run: npm run build

  engine:
    name: Engine (smoke test, NFR1.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      # opencv-python (not -headless) links against libGL, which the runner
      # image does not ship. Installing the system libraries is cheaper than
      # forking the pinned requirements file.
      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Draws its own pattern, runs the real pipeline, and asserts the
      # 5-second budget from NFR1.3 plus a non-zero stain count.
      - name: Smoke test
        run: python app/smoke_test.py